<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>__VIDEO_TITLE__</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
#player-container { display: flex; flex-direction: column; height: 100%; }
#title-bar { padding: 12px 16px; font-size: 15px; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; background: #111; flex-shrink: 0; }
#video-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
video { width: 100%; height: 100%; object-fit: contain; background: #000; }
#error-msg { display: none; padding: 24px; text-align: center; color: #ff6b6b; font-size: 14px; }
</style>
</head>
<body>
<div id="player-container">
    <div id="title-bar">__VIDEO_TITLE__</div>
    <div id="video-wrapper">
        <video id="video" controls autoplay playsinline></video>
    </div>
    <div id="error-msg"></div>
</div>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
<script>
(function() {
    var manifestUrl = "__MANIFEST_URL__";
    var video = document.getElementById('video');
    var errorEl = document.getElementById('error-msg');

    if (!manifestUrl || manifestUrl.indexOf('http') !== 0) {
        errorEl.textContent = 'No manifest URL available.';
        errorEl.style.display = 'block';
        video.style.display = 'none';
        return;
    }

    var player = dashjs.MediaPlayer().create();
    player.updateSettings({
        streaming: {
            buffer: {
                fastSwitchEnabled: true,
                bufferTimeAtTopQuality: 20,
                bufferTimeAtTopQualityLongForm: 30,
                initialBufferLevel: 2,
                bufferTimeDefault: 6
            }
        }
    });
    player.initialize(video, manifestUrl, true);

    // Video-switch detection: re-fetch the manifest every 15s, parse the
    // hidden <!-- vid:... --> comment the proxy injects, and reload the player
    // when the underlying video changes.
    var currentVid = null;
    function parseVid(xml) {
        var m = xml.match(/<!--\s*vid:([0-9A-Za-z_\-]+)\s*-->/);
        return m ? m[1] : null;
    }
    function probeManifest() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', manifestUrl, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4) return;
            if (xhr.status >= 200 && xhr.status < 300) {
                var vid = parseVid(xhr.responseText);
                if (vid && vid !== currentVid) {
                    currentVid = vid;
                    player.initialize(video, manifestUrl, false);
                }
            }
        };
        xhr.send();
    }
    window.setInterval(probeManifest, 15000);

    player.on(dashjs.MediaPlayer.events.ERROR, function(e) {
        if (e.error && e.error.code) {
            errorEl.textContent = 'Playback error: ' + e.error.message;
        } else {
            errorEl.textContent = 'Playback error.';
        }
        errorEl.style.display = 'block';
    });
})();
</script>
</body>
</html>
